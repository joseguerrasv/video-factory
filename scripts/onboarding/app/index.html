<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/bold/style.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#step">Skip to questions</a>
  <div class="shell">
    <aside class="rail" aria-label="Setup steps">
      <div class="brandmark"><i class="ph ph-film-slate" aria-hidden="true"></i><span>Video Factory</span></div>
      <p class="rail-sub">Studio setup</p>
      <ol id="rail-steps" class="rail-steps"></ol>
      <p id="save-status" class="save" aria-live="polite"></p>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="progress" id="progress" role="presentation"><span></span></div>
        <div class="topbar-row">
          <p class="topbar-step"><span id="progress-text"></span><span class="topbar-name" id="progress-name"></span></p>
          <button type="button" id="preview-toggle" class="btn btn--ghost btn--sm" aria-expanded="false" aria-controls="preview"><i class="ph ph-monitor-play" aria-hidden="true"></i> Preview</button>
        </div>
      </div>
      <div id="main-scroll" class="main-scroll">
        <div id="step" class="step"></div>
      </div>
      <footer id="actions" class="actions"></footer>
    </main>

    <aside id="preview" class="preview" aria-label="Live preview of your brand"></aside>
  </div>

  <div id="done" class="done-layer" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
